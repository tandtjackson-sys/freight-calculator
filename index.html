<div class="preset-controls">
    <button type="button" id="save-preset-btn" class="btn-secondary">Save Package Preset</button>
    <button type="button" id="load-preset-btn" class="btn-secondary">Load Saved Preset</button>
</div>

<div class="export-controls" style="margin-top: 15px;">
    <button type="button" id="export-csv-btn" class="btn-action">Export CSV</button>
    <button type="button" id="print-summary-btn" class="btn-action">Print Summary</button>
</div>

<div class="density-meter-container" style="margin: 20px 0;">
    <label><strong>Shipment Density Indicator</strong></label>
    <div class="density-track" style="background: #e0e0e0; height: 18px; border-radius: 9px; position: relative; overflow: hidden; margin-top: 6px;">
        <div id="density-bar" style="background: #0066cc; height: 100%; width: 0%; transition: width 0.4s ease, background-color 0.4s ease;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #666; margin-top: 4px;">
        <span>Low Density (Class 400 - High Cost)</span>
        <span>Medium Density</span>
        <span>High Density (Class 50 - Low Cost)</span>
    </div>
</div>
